<!DOCTYPE html>
<html>
<head>
<title>Animated Rose</title>

<style>

body {
    background: #080808;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
}

/* Rose container */

.rose {
    position: relative;
    width: 200px;
    height: 300px;
}

/* Flower */

.flower {
    position: absolute;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
}

/* Petals */

.petal {
    position: absolute;
    width: 65px;
    height: 85px;
    background: linear-gradient(#ff1744, #8b0000);
    border-radius: 50% 50% 20% 20%;
    transform-origin: bottom center;
    animation: bloom 3s ease-in-out infinite alternate;
}

.petal:nth-child(1) {
    transform: rotate(-60deg);
}

.petal:nth-child(2) {
    transform: rotate(-30deg);
}

.petal:nth-child(3) {
    transform: rotate(0deg);
}

.petal:nth-child(4) {
    transform: rotate(30deg);
}

.petal:nth-child(5) {
    transform: rotate(60deg);
}

/* Stem */

.stem {
    position: absolute;
    width: 7px;
    height: 190px;
    background: green;
    top: 110px;
    left: 97px;
}

/* Leaves */

.leaf {
    position: absolute;
    width: 55px;
    height: 25px;
    background: #228b22;
    border-radius: 100% 0 100% 0;
    top: 180px;
}

.leaf.left {
    left: 45px;
    transform: rotate(20deg);
}

.leaf.right {
    right: 45px;
    transform: rotate(160deg);
}

/* Animation */

@keyframes bloom {
    from {
        transform: scale(0.5) rotate(0deg);
    }

    to {
        transform: scale(1) rotate(15deg);
    }
}

</style>
</head>

<body>

<div class="rose">

    <div class="flower">
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
    </div>

    <div class="stem"></div>

    <div class="leaf left"></div>
    <div class="leaf right"></div>

</div>

</body>
</html>
